<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escola Sabatina — Estudo da Lição</title>
<meta name="theme-color" content="#B26A29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lição">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--surf:#fff;--ink:#2a2118;--mute:#7a6c5c;--line:#e8dfd0;--acc:#B26A29;--accs:#f6e8d6;--ok:#2f7d4f;--verse:#fff7e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--surf:#221c16;--ink:#f0e8dc;--mute:#a89a88;--line:#3a3128;--acc:#e0a062;--accs:#3a2c1d;--ok:#6cc48c;--verse:#2b2218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--surf:#221c16;--ink:#f0e8dc;--mute:#a89a88;--line:#3a3128;--acc:#e0a062;--accs:#3a2c1d;--ok:#6cc48c;--verse:#2b2218;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:8px;align-items:center;padding:12px 0 8px}
.top .ttl{flex:1;min-width:0}
.top small{color:var(--mute);font-size:12px;display:block}
.top h1{font:600 17px/1.2 Lora,Georgia,serif;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
select{max-width:100%}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tab{flex:1;min-width:58px;text-align:center;padding:7px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-size:13px;position:relative}
.tab b{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.on b{color:#ffffffcc}
.tab.done::after{content:"✓";position:absolute;top:-6px;right:-3px;background:var(--ok);color:#fff;border-radius:50%;width:17px;height:17px;font-size:11px;line-height:17px}
.tab.today{outline:2px dashed var(--acc);outline-offset:2px}
main{padding:20px 0 48px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--accs);color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
h2{font:600 28px/1.2 Lora,Georgia,serif;margin:4px 0 18px}
.read{font:400 var(--fs,18px)/1.75 Lora,Georgia,serif}
.read p{margin:0 0 1.1em}
.read h3{font:600 1.05em Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin:1.6em 0 .5em}
.ref{background:var(--accs);color:var(--acc);padding:0 5px;border-radius:6px;font:600 .82em Inter,sans-serif;white-space:nowrap}
.verse{background:var(--verse);border-left:4px solid var(--acc);padding:14px 18px;border-radius:0 14px 14px 0;margin:0 0 1.4em;font-style:italic}
.verse span{display:block;font:600 11px Inter,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:4px}
.q{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin:1.6em 0}
.q .h{display:flex;gap:12px;align-items:flex-start}
.q .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:600 14px Inter,sans-serif}
.q.reflect .n{background:var(--ok)}
.q .t{font:600 1em/1.5 Inter,sans-serif;font-size:16px;margin:3px 0 0}
.q small{display:block;color:var(--mute);font:500 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
textarea{width:100%;margin-top:12px;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.5 Inter,sans-serif;background:var(--bg);color:var(--ink)}
textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.nav{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.nav .go{flex:1;background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600;padding:11px}
.nav .go.undo{background:var(--surf);color:var(--ok)}
.hint{color:var(--mute);font-size:12px;margin-top:8px}
.intro{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:var(--mute)}
@media (max-width:480px){h2{font-size:23px}.read{--fs:17px}}

:root{--hl:#ffe98a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#6a5714}}
:root[data-theme="dark"]{--hl:#6a5714}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.ref{cursor:pointer;text-decoration:underline dotted}
.vn{user-select:none;-webkit-user-select:none}
#sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sc{background:var(--bg);width:min(760px,100%);max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font:600 18px Lora,Georgia,serif}
#sv{display:flex;gap:6px;padding:0 16px 8px}
.vb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#sbody{overflow:auto;padding:4px 16px 12px;flex:1;-webkit-overflow-scrolling:touch}
#sf{display:flex;gap:8px;padding:8px 16px 14px}
#sf button{flex:1}
.bv{font:var(--fs,18px)/1.7 Lora,Georgia,serif;margin:0 0 8px;padding:4px 8px;border-radius:8px}
.bv.sel{background:var(--accs)}
.bv .vn{font:600 11px Inter,sans-serif;color:var(--acc);margin-right:6px;vertical-align:super}
.mute{color:var(--mute);font-size:14px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.orow small{display:block;color:var(--mute)}
#sbody .go{width:100%;margin-top:14px;background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600;padding:11px}
#tool{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:none;gap:8px;align-items:center;max-width:94%;box-shadow:0 6px 24px #0005}
#tool.on{display:flex}
#tl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
#tool button{background:var(--acc);color:#fff;border-color:transparent;font-weight:600}
#tool #tc{background:transparent;color:var(--bg)}

.hero{border-radius:16px;overflow:hidden;background:var(--surf);border:1px solid var(--line);margin-bottom:16px}
.hero img{display:block;width:100%;height:210px;object-fit:cover;background:var(--accs)}
.hero.slim img{height:92px}
.hc{padding:14px 16px}
.hc small{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.hc b{display:block;font:600 22px/1.25 Lora,Georgia,serif;margin-bottom:4px}
.hc span{color:var(--mute);font-size:14px}
.hc a{color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;max-width:92%;text-align:center}
#toast.on{opacity:1}

.top button{flex:none;padding:7px 10px}
body.home #fm,body.home #fp,body.home .bar,body.home .tabs{display:none}
.qh{display:flex;gap:16px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:22px}
.qh img{width:112px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 4px 14px #0003;flex:none;background:var(--accs)}
.qh>div{min-width:0}
.qh small,.wk small{display:block;color:var(--mute);font-size:12px}
.qh b{display:block;font:600 23px/1.2 Lora,Georgia,serif;margin:4px 0 6px}
.qh span{color:var(--mute);font-size:13px;display:block}
.pg{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.pg i{display:block;height:100%;background:var(--acc)}
.hh{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px}
.wk{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.wk img{width:68px;height:68px;border-radius:10px;object-fit:cover;flex:none;background:var(--accs)}
.wk>div:nth-child(2){flex:1;min-width:0}
.wk b{display:block;font:600 15px/1.3 Inter,sans-serif}
.wk .r{text-align:right;flex:none;font-size:12px;color:var(--mute)}
.wk em{display:block;font-style:normal;background:var(--acc);color:#fff;border-radius:99px;padding:2px 9px;font-weight:600;font-size:11px;margin-bottom:4px;white-space:nowrap}
.wk.cur{border:2px solid var(--acc);background:var(--accs)}

header{transition:transform .25s ease}
header.hide{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
.top{padding:6px 0;gap:8px}
.top h1{font-size:15px}
#qt{display:none}
#mn{font-weight:600}
.bar{height:3px;margin:0;border-radius:0}
.tabs{padding:0 0 6px;gap:4px}
.tab{min-width:0;padding:4px 2px;font-size:12px;border-radius:10px}
.tab b{font-size:10px}
.tab.done::after{top:1px;right:1px;width:13px;height:13px;font-size:9px;line-height:13px}
main{padding:14px 0 40px}
body.home #hm{display:none}
#menu{position:absolute;right:12px;top:100%;margin-top:4px;display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 24px #0004;z-index:12}
#menu[hidden]{display:none}
#menu button{white-space:nowrap}
#toast{top:calc(env(safe-area-inset-top,0px) + 56px)}

.au{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 16px}
.au small{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
.au audio{width:100%;display:block;margin-bottom:6px}
.au a{color:var(--acc);font-size:14px;font-weight:600}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;font:15px/1.4 Inter,sans-serif;background:var(--bg)}
.op.ok{background:#2f7d4f26;border-color:var(--ok)}
.op.bad{background:#c0392b26;border-color:#c0392b}
.ex{color:var(--mute);font-size:14px;margin:10px 0}
.in{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
.bt{width:100%;margin-top:12px;padding:12px;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.score{font:600 46px Lora,Georgia,serif;color:var(--acc)}
.rt{display:flex;gap:6px;margin-bottom:8px}
.rt .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rk{width:100%;border-collapse:collapse;font-size:14px}
.rk td{padding:7px 4px;border-bottom:1px solid var(--line)}
.rk tr.me{background:var(--accs);font-weight:600}
.rv summary{cursor:pointer;color:var(--acc);font-weight:600;margin:14px 0 4px}

.bt2{width:100%;padding:11px;background:var(--accs);color:var(--acc);border-color:var(--acc);font-weight:600}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 16px}
.pod>div{flex:1;max-width:116px;text-align:center}
.pod .av{margin:0 auto 4px;width:44px;height:44px}
.pod .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.ped{border-radius:12px 12px 0 0;background:var(--accs);border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:2px}
.ped b{font:600 24px Lora,Georgia,serif;color:var(--acc)}
.p1 .ped{height:104px;background:#ffe9a8;color:#5a4300}.p1 .ped b{color:#7a5a00}
.p2 .ped{height:80px}.p3 .ped{height:64px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 15px Inter,sans-serif;flex:none}
.rw{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;margin-bottom:7px;background:var(--surf);border:1px solid var(--line)}
.rw.me{border:2px solid var(--acc);background:var(--accs)}
.rw .n{width:20px;text-align:center;color:var(--mute);font-weight:600;font-size:13px}
.in2{flex:1;min-width:0}
.rw .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar2{height:6px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--acc);border-radius:9px}
.rw .sc{text-align:right;font-weight:600;font-size:15px;flex:none}
.rw .sc small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.dots{display:flex;gap:3px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.rw .dots{justify-content:flex-start}
.dots i{width:8px;height:8px;border-radius:50%;background:#c0392b}
.dots i.y{background:var(--ok)}
</style>
</head>
<body>
<header id="hd"><div class="wrap">
<div class="top"><button id="hm" aria-label="Lista de lições">☰</button><div class="ttl"><small id="qt"></small><h1 id="wt"></h1></div><button id="mn" aria-label="Ajustes de leitura">Aa</button></div>
<div class="tabs" id="tabs"></div>
<div class="bar"><i id="pb"></i></div>
<div id="menu" hidden><button id="fm" title="Diminuir letra" aria-label="Diminuir letra">A−</button><button id="fp" title="Aumentar letra" aria-label="Aumentar letra">A+</button><button id="th" title="Alternar tema" aria-label="Alternar tema">◐ Tema</button><button id="of" title="Uso offline" aria-label="Uso offline">⤓ Offline</button></div>
</div></header>
<main><div class="wrap" id="app"><p class="intro">Carregando a lição…</p></div></main>
<div id="sheet" hidden><div class="sc"><div class="sh"><span id="st"></span><button id="sx" aria-label="Fechar">✕</button></div><div id="sv"></div><div id="sbody" class="hlz"></div><div id="sf"></div></div></div>
<div id="toast" role="status"></div>
<div id="tool"><span id="tl"></span><button id="tg"></button><button id="tc" aria-label="Fechar">✕</button></div>
<script src="config.js"></script>
<script>
let D,CAP={},AUD={},QZ={};const BK=[["Gn","Gênesis",50],["Ex","Êxodo",40],["Lv","Levítico",27],["Nm","Números",36],["Dt","Deuteronômio",34],["Js","Josué",24],["Jz","Juízes",21],["Rt","Rute",4],["1Sm","1 Samuel",31],["2Sm","2 Samuel",24],["1Rs","1 Reis",22],["2Rs","2 Reis",25],["1Cr","1 Crônicas",29],["2Cr","2 Crônicas",36],["Ed","Esdras",10],["Ne","Neemias",13],["Et","Ester",10],["Jó","Jó",42],["Sl","Salmos",150],["Pv","Provérbios",31],["Ec","Eclesiastes",12],["Ct","Cantares",8],["Is","Isaías",66],["Jr","Jeremias",52],["Lm","Lamentações",5],["Ez","Ezequiel",48],["Dn","Daniel",12],["Os","Oséias",14],["Jl","Joel",3],["Am","Amós",9],["Ob","Obadias",1],["Jn","Jonas",4],["Mq","Miquéias",7],["Na","Naum",3],["Hc","Habacuque",3],["Sf","Sofonias",3],["Ag","Ageu",2],["Zc","Zacarias",14],["Ml","Malaquias",4],["Mt","Mateus",28],["Mc","Marcos",16],["Lc","Lucas",24],["Jo","João",21],["At","Atos",28],["Rm","Romanos",16],["1Co","1 Coríntios",16],["2Co","2 Coríntios",13],["Gl","Gálatas",6],["Ef","Efésios",6],["Fp","Filipenses",4],["Cl","Colossenses",4],["1Ts","1 Tessalonicenses",5],["2Ts","2 Tessalonicenses",3],["1Tm","1 Timóteo",6],["2Tm","2 Timóteo",4],["Tt","Tito",3],["Fm","Filemom",1],["Hb","Hebreus",13],["Tg","Tiago",5],["1Pe","1 Pedro",5],["2Pe","2 Pedro",3],["1Jo","1 João",5],["2Jo","2 João",1],["3Jo","3 João",1],["Jd","Judas",1],["Ap","Apocalipse",22]];
const DAYS=['Sábado','Domingo','Segunda','Terça','Quarta','Quinta','Sexta'];
const ALIAS={'Êx':1};BK.forEach((b,i)=>{ALIAS[b[0]]=i;ALIAS[b[1]]=i;ALIAS[b[1].replace(' ','')]=i});
const REF=new RegExp('(?<![\\wÀ-ú])('+Object.keys(ALIAS).sort((a,b)=>b.length-a.length).join('|')+')\\.? ?(\\d{1,3}):(\\d{1,3})(?:[-–]\\d{1,3})?(?:(?:, ?| e )\\d{1,3}(?:[-–]\\d{1,3})?(?![:\\d]))*','g');
const KEY='ess:v1';
let S={read:{},notes:{},fs:18,theme:'',ver:'aa',qz:{},qp:{},name:'',cls:''},W=0,Dy=0;
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pd=s=>{const[a,b,c]=s.split('/');return new Date(+c,b-1,+a)};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(REF,(m,b)=>`<span class="ref" role="button" data-b="${ALIAS[b]}" data-s="${m.slice(b.length).replace(/^\.? ?/,'')}">${m}</span>`);
function render(md,wi,di){
  let qi=0,pi=0;
  return md.split(/\n\s*\n/).map(b=>{b=b.trim();if(!b)return'';
    if(b[0]=='>'){const t=b.split('\n').map(l=>l.replace(/^>\s?/,'')).filter(Boolean);const lab=t[0].length<40&&t.length>1?t.shift():'Verso';return`<div class="verse"><span>${inl(lab)}</span>${inl(t.join(' '))}</div>`}
    const q=b.match(/^`([\s\S]+)`$/);
    if(q){const k=wi+'-'+di+'-'+(qi++);const m=q[1].match(/^(\d+)\.\s*([\s\S]*)$/);
      const num=m?m[1]:'?',txt=m?m[2]:q[1];
      return`<div class="q ${m?'':'reflect'}"><div class="h"><div class="n">${m?num:'✎'}</div><div><small>${m?'Pergunta':'Para refletir'}</small><div class="t" data-hs="L:q${k}">${inl(txt)}</div></div></div><textarea data-k="${k}" placeholder="Escreva sua resposta ou reflexão…">${esc(S.notes[k]||'')}</textarea></div>`}
    const h=b.match(/^#{2,4}\s+(.*)/);if(h)return`<h3>${inl(h[1])}</h3>`;
    return`<p data-hs="L:${wi}-${di}-${pi++}">${inl(b).replace(/\n/g,'<br>')}</p>`}).join('');
}
function weekRead(wi){return D.weeks[wi].days.filter((_,i)=>S.read[wi+'-'+i]).length}
let VIEW='day';
function draw(){
  if(VIEW=='home')return renderHome();
  document.body.classList.remove('home');$('hm').textContent='☰';
  const w=D.weeks[W],d=w.days[Dy];
  $('qt').textContent=D.title+' · '+D.human;
  $('wt').textContent='Lição '+w.n+' — '+w.title;
  const t=new Date();t.setHours(0,0,0,0);
  const ti=Math.floor((t-pd(w.start))/864e5);

async function findQuarter(){
  const t=new Date();t.setHours(0,0,0,0);const y=t.getFullYear(),q=Math.ceil((t.getMonth()+1)/3),ids=[];
  for(const dq of[1,0,-1]){let Y=y,Q=q+dq;if(Q>4){Q=1;Y++}if(Q<1){Q=4;Y--}ids.push(Y+'-0'+Q)}
  const inf=await Promise.all(ids.map(id=>ghText(id+'/info.yml').then(x=>[id,x]).catch(()=>null)));
  let best=null;
  for(const i of inf){if(!i)continue;const a=pdate(yv(i[1],'start_date')),b=pdate(yv(i[1],'end_date'));if(a&&b&&a<=t&&t<=b)return i;if(a&&a<=t&&(!best||a>best.a))best={a,i}}
  return best&&best.i;
}
function parseDay(raw,first){
  const m=raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);let body=(m?m[2]:raw).trim().replace(/<[^>]+>/g,''),reads='';
  if(first){const r=body.match(/###\s*Leituras da semana\s*\n(.*)/);if(r){reads=r[1].trim();body=body.slice(0,r.index).trim()}}
  return{t:m?yv(m[1],'title'):'',md:body,reads};
}
async function fetchQuarter(id,info){

    try{wi=await ghText(p+'info.yml')}catch(e){return null}

    return{n,title:yv(wi,'title'),start:yv(wi,'start_date'),end:yv(wi,'end_date'),reads:days[0].reads,days:days.map(x=>({t:x.t,md:x.md}))};
  }));

  return`<div class="au"><small>🎧 Áudio da lição · CPB mais</small>${f?`<audio controls preload="none" src="${esc(f)}"></audio>`:`<button class="bt2" data-au="${esc(a.page)}">▶ Ouvir aqui no app</button>`}</div>`;
}
function openAudio(url){
  bib=null;$('sheet').hidden=false;$('st').textContent='Áudio da lição';$('sv').innerHTML='';$('sf').innerHTML='';
  $('sbody').innerHTML=`<iframe src="${esc(url)}" allow="autoplay" style="width:100%;height:min(62vh,560px);border:0;border-radius:12px;background:#fff"></iframe><p class="mute">Toque no dia desejado e depois no play. Se o player não aparecer, <a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--acc)">abra no site da CPB</a>.</p>`;
}
/* ===== quiz: uma pergunta por dia de estudo, tirada do texto daquele dia ===== */
const SW=new Set('que como para por com uma uns umas das dos nos nas mas não sua seu suas seus isso essa esse este esta estes estas ele ela eles elas quando onde pois também ainda então porque sobre entre até sem mais muito todos todas cada outro outra outros outras são foi ser tem tinha pelo pela pelos pelas aos nós vocês você deus senhor jesus cristo testamento bíblia através assim sempre apenas mesmo mesma outras pode podem deve devem fazer feito tudo nada alguém algo quanto quando durante depois antes dentro fora ainda'.split(' '));
const DN=['sábado','domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira'];
const qid=wi=>D.id+'-'+String(D.weeks[wi].n).padStart(2,'0');
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const qcache={};
const quizFor=wi=>{const id=qid(wi);return QZ[id]||(qcache[id]=qcache[id]||genQuiz(wi,id))};
function genQuiz(wi,id){
  const w=D.weeks[wi],r=rng(id),pick=a=>a[Math.floor(r()*a.length)];
  const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const cl=t=>t.replace(/\*\*?|_/g,'').replace(/\s+/g,' ').trim(),lw=t=>cl(t).match(/[A-Za-zÀ-ú]{6,}/g)||[];
  const nr=x=>{const m=x.match(/^((?:\d ?)?[A-Za-zÀ-ú]+)\.? ?(\d.*)$/);return m&&ALIAS[m[1]]!==undefined?BK[ALIAS[m[1]]][0]+' '+m[2]:x};
  const weekWords=[...new Set(lw(w.days.map(d=>d.md).join(' ')).map(x=>x.toLowerCase()))].filter(x=>!SW.has(x));
  const refs=[...new Set([...w.days.map(d=>d.md).join('\n').matchAll(REF)].map(m=>nr(m[0])))];
  function build(sent,key,pool){
    const ws=sent.split(' '),i=ws.findIndex(x=>x.replace(/[^A-Za-zÀ-ú]/g,'').toLowerCase()==key);if(i<0)return null;
    const w0=ws[i].replace(/[^A-Za-zÀ-ú]/g,''),cap=w0[0]!=w0[0].toLowerCase(),inS=new Set(sent.toLowerCase().match(/[a-zà-ú]+/g));
    const ok=x=>x!=key&&x.slice(0,5)!=key.slice(0,5)&&!inS.has(x)&&Math.abs(x.length-key.length)<=4;
    const sc=x=>x.slice(-2)==key.slice(-2)?2:x.slice(-1)==key.slice(-1)?1:0,top=a=>sh(a).sort((x,y)=>sc(y)-sc(x));
    let ds=top(pool.filter(ok)).slice(0,3);if(ds.length<3)ds=[...ds,...top(weekWords.filter(x=>ok(x)&&!ds.includes(x))).slice(0,3-ds.length)];
    if(ds.length<3)return null;
    const f=x=>cap?x[0].toUpperCase()+x.slice(1):x,o=sh([w0,...ds.map(f)]);
    return{blank:ws.map((x,j)=>j==i?x.replace(w0,'_____'):x).join(' '),o,a:o.indexOf(w0)};
  }
  function dayQ(d,di){
    const h=DAYS[di]+' · '+cl(d.t);
    const prose=d.md.split(/\n\s*\n/).filter(p=>!/^[>`#]/.test(p.trim())).map(cl).join(' ');
    const fr={};lw(prose).forEach(x=>{x=x.toLowerCase();if(!SW.has(x))fr[x]=(fr[x]||0)+1});
    const pool=Object.keys(fr).sort((a,b)=>fr[b]-fr[a]).slice(0,40);
    if(di==0){ // sábado: verso para memorizar
      const m=d.md.match(/>\s*[“"]([^”"]{30,400})[”"]\s*\(([^()]+)\)/);
      if(m){const t=cl(m[1]),ref=nr(m[2].trim()),ks=lw(t).map(x=>x.toLowerCase()).filter(x=>!SW.has(x));
        if(ks.length){const b=build(t,pick(ks),weekWords);if(b)return{h,q:`Complete o verso para memorizar (${ref}):\n“${b.blank}”`,o:b.o,a:b.a,e:`${ref}: “${t}”`}}}
    }
    const keys=pool.filter(x=>fr[x]>=2).slice(0,12);
    const sents=prose.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ú])/).filter(x=>{const n=x.split(' ').length;return n>=12&&n<=32&&!/[“”"()\d:]/.test(x)&&/[.!?]$/.test(x)&&!/^(Ele|Ela|Eles|Elas|Isso|Esse|Essa|Este|Esta|Mas|E|Porém|Assim|Então|Portanto|Além|Também|Ou)\b/.test(x)});
    let best=null;
    for(const x of sh(sents)){const low=x.toLowerCase(),hit=keys.filter(k=>new RegExp('(?<![a-zà-ú])'+k+'(?![a-zà-ú])').test(low));if(hit.length&&(!best||hit.length>best.hit.length))best={x,hit}}
    if(best){const key=pick(best.hit),b=build(best.x,key,pool);
      if(b)return{h,q:'Complete a frase do estudo:\n“'+b.blank+'”',o:b.o,a:b.a,e:`Revise o estudo de ${DN[di]} (“${cl(d.t)}”): “${best.x}”`}}
    const qs=[...d.md.matchAll(/[“"]([^”"\n]{40,320})[”"]\s*\(([^()\n]*?\d+:\d+[^()\n]*)\)/g)].map(m=>({t:cl(m[1]),ref:nr(m[2].split(';')[0].trim())})).filter(x=>/^(?:\d ?)?[A-ZÀ-Ú][A-Za-zà-ú]+\.? ?\d+:\d+/.test(x.ref));
    if(qs.length){const x=pick(qs),ds=sh(refs.filter(y=>y!=x.ref&&!x.ref.startsWith(y)&&!y.startsWith(x.ref)));
      if(ds.length>=3){const o=sh([x.ref,...ds.slice(0,3)]);return{h,q:`Qual é a referência bíblica deste texto do estudo?\n“${x.t.length>200?x.t.slice(0,200)+'…':x.t}”`,o,a:o.indexOf(x.ref),e:`Texto de ${x.ref}.`}}}
    return null;
  }
  const out=w.days.map(dayQ).filter(Boolean);return out.length>=3?out:[];
}
const API=(window.ESS_CONFIG||{}).apiUrl||'',API_ON=!!API;
const api=p=>fetch(API+(API.includes('?')?'&':'?')+new URLSearchParams(p)).then(r=>{if(!r.ok)throw 0;return r.json()});
const nkey=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
async function sendScore(id,r){
  const x=await api({action:'submit',qid:id,name:r.name,cls:r.cls||'',score:r.score,total:r.total,sec:r.sec,pat:r.qs.map((q,i)=>r.ans[i]==q.a?1:0).join('')});
  if(x.ok)return'ok';if(x.dup)return'dup';throw 0;
}
let RKF='all',RKS='week',RKD=null;
function renderQuiz(){
  const wi=W,id=qid(wi),w=D.weeks[wi],p=S.qp[id],rec=S.qz[id],qs=(p&&p.qs)||(rec&&rec.qs)||quizFor(wi);
  if(p&&!rec&&qs.length&&p.ans.length>=qs.length)return finish(id);
  let h=`<div class="meta"><span class="chip">🏆 Quiz · Lição ${w.n}</span>${qs.length?`<span class="chip">${qs.length} perguntas · uma por dia</span>`:''}</div><h2>Quiz da semana</h2>`,rk=true;
  if(!qs.length)h+='<p class="intro">Esta semana ainda não tem conteúdo suficiente para gerar o quiz.</p>';
  else if(rec)h+=scoreHTML(rec);
  else if(p){rk=false;const i=p.ans.length,q=qs[i];
    h+=`<div class="pg"><i style="width:${i/qs.length*100}%"></i></div><p class="mute">Pergunta ${i+1} de ${qs.length}</p><div class="q" id="qq">${q.h?`<small>${esc(q.h)}</small>`:''}<div class="t" style="white-space:pre-line">${esc(q.q)}</div>${q.o.map((o,k)=>`<button class="op" data-qo="${k}">${esc(o)}</button>`).join('')}<div id="qf"></div></div>`}
  else h+=`<div class="q"><div class="t">Responda ${qs.length} perguntas, uma sobre o texto de cada dia de estudo. <b>Só é possível responder uma vez</b>. As respostas só aparecem para quem responde; a pontuação, para todos.</div><input class="in" id="qn" maxlength="24" placeholder="Seu nome (aparece no ranking)" value="${esc(S.name)}"><input class="in" id="qc" maxlength="20" placeholder="Código da classe (opcional)" value="${esc(S.cls)}"><button class="bt" id="qgo">Começar o quiz</button></div>`;
  if(rk&&qs.length)h+='<h3 class="hh" style="margin-top:22px">Ranking</h3><div id="rk"><p class="mute">Carregando…</p></div>';
  if(rec)h+=`<details class="rv"><summary>Rever minhas respostas</summary>${qs.map((q,i)=>`<div class="q">${q.h?`<small>${esc(q.h)}</small>`:''}<div class="t" style="white-space:pre-line">${esc(q.q)}</div><p class="ex">${rec.ans[i]==q.a?'✓':'✗'} Você: ${esc(q.o[rec.ans[i]]||'—')}${rec.ans[i]==q.a?'':'<br>Certa: '+esc(q.o[q.a])}<br>${esc(q.e||'')}</p></div>`).join('')}</details>`;
  $('app').innerHTML=h+`<div class="nav"><button id="pv">← Anterior</button><button id="nx" ${W==D.weeks.length-1?'disabled':''}>Próxima lição →</button></div>`;
  if(rk&&qs.length)loadRank(id);
}
function scoreHTML(r){
  const st=!API_ON?'<p class="mute">Ranking desativado: falta colar a URL do Google Apps Script em config.js (veja o README). Seu resultado ficou salvo no aparelho.</p>':r.sent?'<p class="mute">✓ Pontuação enviada ao ranking.</p>':r.dup?`<div class="q"><div class="t">O nome “${esc(r.name)}” já respondeu este quiz em outro aparelho. Envie com outro nome:</div><input class="in" id="qrn" maxlength="24" placeholder="Outro nome"><button class="bt" id="qrg">Enviar ao ranking</button></div>`:'<p class="mute">Enviando ao ranking… (sem internet, o envio é feito quando a conexão voltar)</p>';
  return`<div class="q" style="text-align:center"><div class="score">${r.score}/${r.total}</div><div class="mute">${esc(r.name)}${r.cls?' · classe '+esc(r.cls):''} · tempo ${fmt(r.sec)}</div></div>${st}`;
}
function answer(k){
  const id=qid(W),p=S.qp[id],qq=$('qq');if(!p||!qq||qq.dataset.l)return;
  const q=p.qs[p.ans.length];qq.dataset.l=1;p.ans.push(k);save();
  document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('bad')});
  $('qf').innerHTML=`<p class="ex">${k==q.a?'✓ Correto!':'✗ Resposta certa: '+esc(q.o[q.a])+'.'} ${esc(q.e||'')}</p><button class="bt" id="qnx">${p.ans.length>=p.qs.length?'Ver resultado':'Próxima pergunta'}</button>`;
}
function finish(id){
  const p=S.qp[id],qs=p.qs;
  S.qz[id]={score:qs.filter((q,i)=>p.ans[i]==q.a).length,total:qs.length,sec:Math.min(86399,Math.round((Date.now()-p.t0)/1000)),name:S.name,cls:S.cls,ts:Date.now(),ans:p.ans,qs,sent:0};
  delete S.qp[id];save();draw();trySend(id);
}
async function trySend(id){
  const r=S.qz[id];if(!API_ON||!r||r.sent||r.dup||!navigator.onLine)return;
  try{const x=await sendScore(id,r);if(x=='ok')r.sent=1;else r.dup=1;save();RKD=null}catch(e){return}
  if(VIEW=='day'&&Dy==7&&qid(W)==id&&!(document.activeElement&&document.activeElement.tagName=='INPUT'))renderQuiz();
}
const retrySends=()=>Object.keys(S.qz).forEach(trySend);
async function loadRank(id){
  const el=$('rk');if(!el)return;
  if(!API_ON){el.innerHTML='<p class="mute">Ranking indisponível: falta configurar o Google Apps Script (veja o README).</p>';return}
  const k=id+RKS+nkey(S.name||'');
  try{if(!RKD||RKD.k!=k||Date.now()-RKD.t>2e4){const x=await api({action:'rank',qid:id,scope:RKS,me:nkey(S.name||'')});RKD={k,t:Date.now(),rows:x.rows||[],answered:!!x.answered}}drawRank()}
  catch(e){el.innerHTML='<p class="mute">Não foi possível carregar o ranking agora (sem internet?).</p><button data-rk="retry">Tentar de novo</button>'}
}
function drawRank(){
  const el=$('rk');if(!el||!RKD)return;const me=nkey(S.name||''),q=RKS=='quarter';
  let rows=RKD.rows.slice().sort((a,b)=>b.score-a.score||a.sec-b.sec||a.ts-b.ts);
  if(RKF=='cls'&&S.cls)rows=rows.filter(x=>x.cls.toLowerCase()==S.cls.toLowerCase());
  const av=n=>`<div class="av" style="background:hsl(${Math.abs([...n].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360} 42% 40%)">${esc((n.trim()[0]||'?').toUpperCase())}</div>`;
  const dots=x=>x.pat?`<div class="dots">${[...x.pat].map(c=>`<i class="${c=='1'?'y':''}"></i>`).join('')}</div>`:'';
  const pod=rows.length>=2,first=pod?3:0,mi=rows.findIndex(x=>nkey(x.name)==me);
  const tabs=`<div class="rt"><button data-rs="week" class="${q?'':'on'}">Esta semana</button><button data-rs="quarter" class="${q?'on':''}">Trimestre</button></div>`+(S.cls?`<div class="rt"><button data-rk="all" class="${RKF=='all'?'on':''}">Todos</button><button data-rk="cls" class="${RKF=='cls'?'on':''}">Minha classe (${esc(S.cls)})</button></div>`:'');
  const podium=pod?`<div class="pod">${[1,0,2].filter(i=>rows[i]).map(i=>{const x=rows[i];return`<div class="p${i+1}">${av(x.name)}<div class="nm">${esc(x.name)}</div><div class="ped"><span>${['🥇','🥈','🥉'][i]}</span><b>${x.score}</b>${dots(x)}</div></div>`}).join('')}</div>`:'';
  const list=rows.slice(first,30).map((x,k)=>`<div class="rw${nkey(x.name)==me?' me':''}"><div class="n">${k+first+1}</div>${av(x.name)}<div class="in2"><div class="nm">${esc(x.name)}${x.cls?` <small class="mute">${esc(x.cls)}</small>`:''}</div><div class="bar2"><i style="width:${x.total?x.score/x.total*100:0}%"></i></div>${dots(x)}</div><div class="sc">${x.score}/${x.total}<small>${q?x.n+(x.n>1?' quizzes':' quiz'):fmt(x.sec)}</small></div></div>`).join('');
  el.innerHTML=tabs+(rows.length?`${mi>=0?`<p class="mute" style="text-align:center">Você está em <b>${mi+1}º lugar</b> de ${rows.length}</p>`:''}${podium}${list}<p class="mute" style="text-align:center">${rows.length} participante${rows.length>1?'s':''} · empate decidido pelo menor tempo${!RKD.answered&&!q?'<br>🔒 Responda ao quiz para ver os acertos (●) de cada colega':''}</p>`:'<p class="mute" style="text-align:center">Ninguém no ranking ainda. Seja o primeiro!</p>');
}
document.addEventListener('click',e=>{
  const t=e.target,id=D&&qid(W);
  if(t.dataset&&t.dataset.au)return openAudio(t.dataset.au);
  if(t.dataset&&t.dataset.qo!==undefined)return answer(+t.dataset.qo);
  if(t.id=='qgo'){const n=$('qn').value.trim();if(n.length<2){$('qn').focus();$('qn').placeholder='Digite seu nome (mín. 2 letras)';return}
    S.name=n;S.cls=$('qc').value.trim();S.qp[id]={t0:Date.now(),ans:[],qs:quizFor(W)};save();return renderQuiz()}
  if(t.id=='qnx'){const p=S.qp[id];return p&&p.ans.length>=p.qs.length?finish(id):renderQuiz()}
  if(t.id=='qrg'){const n=$('qrn').value.trim(),r=S.qz[id];if(n.length<2||!r)return;r.name=S.name=n;r.dup=0;save();trySend(id);return renderQuiz()}
  if(t.dataset&&(t.dataset.rk||t.dataset.rs)){if(t.dataset.rk=='retry')RKD=null;else if(t.dataset.rk)RKF=t.dataset.rk;else{RKS=t.dataset.rs;RKD=null}loadRank(id)}
});
addEventListener('online',retrySends);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
apply();
const jf=u=>fetch(u).then(r=>r.json()).catch(()=>({}));
Promise.all([loadLesson(),jf('data/capas.json'),jf('data/audios.json'),jf('data/quiz.json')]).then(([d,c,a,z])=>{CAP=c;AUD=a;QZ=z;adopt(d);VIEW='home';draw();autoSync();retrySends()}).catch(()=>{$('app').innerHTML='<p class="intro">Não foi possível carregar a lição. Conecte-se à internet uma vez para salvá-la neste aparelho.</p>'});
</script>
